# Monokulo's OpenAPI document at the commit in tests/vectors/PIN, with its
# recorded exchanges, for the tests' stand-in Monokulo (tests/Support/Api).
# It is generated from Monokulo's source (scripts/openapi), never committed,
# and cached by commit: only a new pin builds it. The jobs that need it
# download the `openapi` artifact into tests/.
name: OpenAPI

on:
  workflow_call:
    secrets:
      MONOKULO_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  openapi:
    name: Monokulo's OpenAPI document
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The pinned commit
        id: pin
        run: |
          . tests/vectors/PIN
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            tests/openapi.json
            tests/openapi.commit
          key: monokulo-openapi-${{ steps.pin.outputs.commit }}
      - name: Generate it from Monokulo's source
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
          RUSTUP_AUTO_INSTALL: '1'
        run: scripts/openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            tests/openapi.json
            tests/openapi.commit
          if-no-files-found: error
